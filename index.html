<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Snake - Rắn săn mồi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .game {
            background-color: white;
            border: 1px solid #cccccc;
            padding: 24px;
            width: 500px;
        }

        #title {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #555555;
            margin-bottom: 16px;
        }

        #home {
            padding: 12px 0;
        }

        #home button {
            display: block;
            width: 220px;
            margin: 14px auto;
        }

        .levels {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding-top: 12px;
        }

        .levels button {
            width: 65px;
            padding: 10px 6px;
            white-space: nowrap;
        }

        .nutVe {
            display: block;
            width: 220px;
            margin: 20px auto 0;
        }

        button {
            padding: 10px 12px;
            background-color: #eeeeee;
            border: 1px solid #999999;
            cursor: pointer;
        }

        button:hover {
            background-color: #dddddd;
        }

        #stop {
            width: 80px;
        }

        #san {
            position: relative;
            width: 450px;
            height: 450px;
            margin: 16px auto;
        }

        #game {
            width: 100%;
            height: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        #lose {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000a6;
            color: white;
            font-size: 36px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #lose[hidden] {
            display: none;
        }

        .cell {
            width: 30px;
            height: 30px;
            border: 1px solid black;
            font-size: 14px;
            line-height: 14px;
        }

        .congA {
            background-color: cyan;
        }

        .congB {
            background-color: cyan;
        }

        .dot {
            background-color: greenyellow;
        }

        .apple {
            background-color: red;
        }

        .tuong {
            background-color: gray;
        }

        .appleDoc {
            background-color: purple;
        }

        .appleTuong {
            background-color: blue;
        }

        .appleDao {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <main class="game">
        <h1 id="title">RẮN SĂN MỒI</h1>
        <p id="subtitle" class="subtitle" hidden></p>
        <p id="daoPhim" class="subtitle" hidden></p>
        <section id="home">
            <button id="choiNgay" type="button">Chơi ngay</button>
            <button id="chonMan" type="button">Chọn màn chơi</button>
        </section>
        <section id="menu" hidden>
            <div class="levels">
                <button id="l1" type="button">Level 1</button>
                <button id="l2" type="button">Level 2</button>
                <button id="l3" type="button">Level 3</button>
                <button id="l4" type="button">Level 4</button>
                <button id="l5" type="button">Level 5</button>
                <button id="l6" type="button">Level 6</button>
            </div>
            <button id="backHome" class="nutVe" type="button">Quay lại</button>
        </section>
        <div id="san" hidden>
            <table id="game" hidden></table>
            <div id="lose" hidden>GAME OVER</div>
        </div>
        <div id="buttons" hidden>
            <button id="stop" type="button">Stop</button>
            <button id="restart" type="button" hidden>Chơi lại</button>
            <button id="back" type="button">Về menu</button>
            <button id="next" type="button" hidden>Next</button>
        </div>
    </main>
    <script src="game.js"></script>
</body>

</html>
